name: Saved calibration replay
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: sha256sum --check SHA256SUMS
      - run: python replay_saved_fit.py
      - run: python -m unittest discover -s source/calibration -p 'test_tilt_calibration.py'
      - run: python -m compileall -q source replay_saved_fit.py
